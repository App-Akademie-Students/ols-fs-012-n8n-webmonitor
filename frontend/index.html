<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website & Content Monitor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>AI Website & Content Monitor</h1>
      <p>Übersicht von relevanten Artikeln zu künstlicher Intelligenz</p>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <div class="control-group">
        <label for="search">Nach Titel suchen:</label>
        <input 
          type="text" 
          id="search" 
          placeholder="Suchbegriff eingeben..."
        >
      </div>

      <div class="control-group">
        <label for="min-relevance">Min. Relevanz:</label>
        <input 
          type="number" 
          id="min-relevance" 
          value="0" 
          min="0" 
          max="10"
        >
      </div>

      <button id="refresh-btn">Aktualisieren</button>

      <div id="status" class="status"></div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Titel</th>
            <th>Kategorie</th>
            <th class="text-right">Relevanz</th>
            <th class="text-right">Veröffentlicht</th>
          </tr>
        </thead>
        <tbody id="articles-tbody">
          <tr>
            <td colspan="4" class="text-center">Lädt...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="article-details"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
